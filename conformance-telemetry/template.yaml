AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Go SDK examples for the Durable Execution Telemetry conformance suite

Parameters:
  LambdaExecutionRoleArn:
    Type: String
    Description: Pre-created execution role for the test functions
  TelemetryLogGroupName:
    Type: String
    Description: CloudWatch Logs group that receives Durable Execution Telemetry records

Globals:
  Function:
    Runtime: provided.al2023
    Architectures:
      - x86_64
    Timeout: 60
    MemorySize: 128
    DurableConfig:
      ExecutionTimeout: 300
      RetentionPeriodInDays: 1
    Environment:
      Variables:
        TELEMETRY_LOG_GROUP_NAME: !Ref TelemetryLogGroupName

Resources:
  # Extensions have no pre-deploy hook, so CloudFormation creates the group
  # before the runner invokes any function.
  TelemetryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Ref TelemetryLogGroupName
      RetentionInDays: 1

  Telemetry1Success:
    Type: AWS::Serverless::Function
    DependsOn: TelemetryLogGroup
    TestingMetadata:
      TestDescription:
        - telemetry-1
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/telemetry_1_success/
      Handler: bootstrap
      FunctionName: !Sub "${AWS::StackName}-telemetry-1"
      Role: !Ref LambdaExecutionRoleArn

  Telemetry2Failure:
    Type: AWS::Serverless::Function
    DependsOn: TelemetryLogGroup
    TestingMetadata:
      TestDescription:
        - telemetry-2
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/telemetry_2_failure/
      Handler: bootstrap
      FunctionName: !Sub "${AWS::StackName}-telemetry-2"
      Role: !Ref LambdaExecutionRoleArn

  Telemetry3ResultSelect:
    Type: AWS::Serverless::Function
    DependsOn: TelemetryLogGroup
    TestingMetadata:
      TestDescription:
        - telemetry-3
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/telemetry_3_result_select/
      Handler: bootstrap
      FunctionName: !Sub "${AWS::StackName}-telemetry-3"
      Role: !Ref LambdaExecutionRoleArn

  Telemetry4FullTreeMap:
    Type: AWS::Serverless::Function
    DependsOn: TelemetryLogGroup
    TestingMetadata:
      TestDescription:
        - telemetry-4
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/telemetry_4_full_tree_map/
      Handler: bootstrap
      FunctionName: !Sub "${AWS::StackName}-telemetry-4"
      Role: !Ref LambdaExecutionRoleArn
