# cfn-lint configuration for conformance/template.yaml.
#
# Both ignored rules below are the SAME underlying false positive,
# against two different places this template attaches the deliberate,
# required, custom TestingMetadata key (see the upstream
# aws-durable-execution-conformance-tests repo's own documented
# contract: README.md "Declaring an intentional gap (NOT_IMPLEMENTED)",
# and src/aws_durable_execution_conformance_tests/validate.py's
# parse_function_descriptions/parse_not_implemented, which explicitly
# read this exact key both as a top-level template key and per-resource):
#
# - E1001 ("Basic CloudFormation Template Configuration ... Additional
#   properties are not allowed ('TestingMetadata' was unexpected)") would
#   fire against a top-level, template-sibling-of-Resources
#   TestingMetadata.NotImplemented block - not used in this template
#   (CloudFormation's own changeset validation rejects that form outright
#   at real `sam deploy` time, confirmed directly - see
#   ConformanceExecutionRole's own doc comment for the full story), but
#   kept ignored here for forward-compatibility with any future
#   top-level TestingMetadata usage in this template.
# - E3001 ("Basic CloudFormation Resource Check ... Additional
#   properties are not allowed ('TestingMetadata' was unexpected)") fires
#   against the SAME custom key attached per-resource on
#   ConformanceExecutionRole (AWS::IAM::Role) - this template's actually
#   deployed way of declaring TestingMetadata.NotImplemented (see that
#   resource's own doc comment). cfn-lint's schema for a plain,
#   non-transformed resource type like AWS::IAM::Role has no notion of
#   this custom key (unlike AWS::Serverless::Function, whose SAM
#   transform is more permissive about unrecognized resource-level keys
#   - see every Step1N* function's own identical
#   TestingMetadata.TestDescription usage, which does NOT trigger this
#   or any other lint rule).
#
# Ignoring these two specific, understood, false-positive rules is the
# minimal correct suppression - not a blanket lint bypass.
ignore_checks:
  - E1001
  - E3001
