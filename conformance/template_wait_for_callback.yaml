AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Go (WaitForCallback)
Parameters:
  ExecutionRoleArn:
    Type: String
    Description: IAM role the deployed functions assume
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 300
    MemorySize: 128
    # The conformance runner correlates CloudWatch records to a durable
    # execution with a JSON filter on the executionArn field the SDK context
    # logger attaches. That field only survives under the JSON log format.
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: INFO

Resources:
  WaitForCallbackBasic:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    TestingMetadata:
      TestDescription: ["7-1"]
    Properties:
      CodeUri: publish/wait_for_callback_basic/
      Handler: bootstrap
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitForCallbackExplicitName:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    TestingMetadata:
      TestDescription: ["7-2"]
