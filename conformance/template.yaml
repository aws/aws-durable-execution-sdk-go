  # user request and found to be a real, buildable feature gap, not a
  # permanent limitation - the JS reference SDK has a genuine, public,
  # DISTINCT MapConfig.serdes field (types/batch.ts: "for parent
  # context", separate from itemSerdes's own "for each item"), and its
  # own mechanism (map-handler.ts forwards config.serdes straight into
  # runInChildContext's OWN options.serdes) confirms this is the exact
  # same generic per-context serdes hook RunInChildContext/
  # WithChildSerdes already implements one level down in this very Go
  # SDK, not a Map/Parallel-specific mechanism at all. Implemented as
  # operations.WithMapResultSerdes[TIn, TOut](types.Serdes)
  # (pkg/durable/operations/batch.go), which finishBatch/
  # deserializeBatchResult now dispatch to (by concrete type) instead of
  # the old, unconditional batchResultWire[TOut]/MarshalJSON path - see
  # handlers/map_9_19.go for this requirement's own real handler and the
  # full fix writeup.
