  # --- Suite 5: Invoke (test-requirements/invoke/) ---
  #
  # Same logical id convention as every suite above: Invoke5N<minor>.
  # This is the FIRST suite that needs a real, separate, plain
  # (non-durable) TARGET Lambda function for operations.Invoke to call -
  # every other suite's operations are entirely self-contained within the
  # one conformance function under test. See conformance/echo-target/
  # main.go's own doc comment for the target's full design (one smart
  # echo target, not several single-purpose ones - branches on an
  # optional reserved __echoTargetControl.fail field in its own input to
  # cover the two requirements, 5-5 and 5-6, that need a genuine target
  # failure rather than a plain echo).
  #
  # EchoTargetImageUri is a SEPARATE template Parameter (not reusing
  # ImageUri) because this target is built from an entirely different
  # Dockerfile/Go module (conformance/echo-target/, its own go.mod - see
  # that module's own files) than every Invoke5N* function's shared
  # conformance/ image, exactly mirroring how ImageUri itself is already
  # a template Parameter rather than resolved via SAM's own
  # --resolve-image-repos (see this template's own top-level doc comment)
  # for the identical `hatch run validate --image-uri ...`-driven
  # workflow reason.
  #
  # EchoTarget is a genuine, durable AWS::Lambda::Function (see
  # echo-target/main.go's own doc for why: this field's own
  # ChainedInvokeStartedDetails.DurableExecutionArn requirement in 15 of
  # this suite's 16 requirements is only satisfiable when the INVOKED
  # TARGET is itself durable - confirmed via a real, deployed experiment,
  # not assumed). Kept as a plain AWS::Lambda::Function resource (not
  # AWS::Serverless::Function) since it has no TestingMetadata/
  # conformance-suite registration of its own - only DurableConfig is
  # added explicitly here (Globals: Function: DurableConfig, above, only
  # applies to AWS::Serverless::Function resources, not plain
  # AWS::Lambda::Function ones like this).
  #
  # The conformance test runner itself never invokes EchoTarget directly
  # (it has no TestingMetadata.TestDescription and is not one of the ids
  # the conformance suite validates against) - only this template's own
  # Invoke5N* functions call it, via operations.Invoke, at runtime.
  #
  # No resource-based (Lambda function) policy is attached to EchoTarget
  # granting any specific caller lambda:InvokeFunction - confirmed
  # unnecessary by a real, successful end-to-end deployment and
  # operations.Invoke call during this session (see this session's own
  # commit message/report for the exact verification): a same-account
  # Invoke call only needs the CALLER's own IDENTITY policy (i.e.
  # ConformanceExecutionRole, which every Invoke5N* function already
  # shares and reuses - see EchoTargetInvokePolicy below) to allow
  # lambda:InvokeFunction on the target's ARN; Lambda's own resource-based
  # policy is only required for a CROSS-account or service-principal
  # caller, neither of which applies here.
  EchoTarget:
    Type: AWS::Lambda::Function
    Properties:
      PackageType: Image
      Code:
        ImageUri: !Ref EchoTargetImageUri
      Role: !GetAtt EchoTargetExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Architectures:
        - arm64
      DurableConfig:
        ExecutionTimeout: 30
        RetentionPeriodInDays: 1

  # EchoTargetVersion publishes an immutable, QUALIFIED version of
  # EchoTarget - required because a durable function cannot be invoked
  # via an unqualified ARN/$LATEST (confirmed via a real, deployed
  # InvalidParameterValueException: "You cannot invoke a durable function
  # using an unqualified ARN" - the exact same constraint this repo's own
  # examples already work around by publishing a version manually after
  # each deploy, e.g. large-payload-go-example/completion-config-go-example -
  # see docs/remaining-work.md's own redeployment writeups). Description
  # is set to EchoTargetImageUri's OWN current value specifically so this
  # resource's logical id can stay fixed across deploys while still
  # forcing a fresh version publish whenever the image changes:
  # AWS::Lambda::Version's own Description property requires Replacement
  # on update (per its own CloudFormation Template Reference), so tying
  # it directly to the parameter that actually changes when the target's
  # code changes makes CloudFormation replace this resource (publish a
  # new version) exactly when needed, with no manual
  # `aws lambda publish-version` step required the way the examples above
  # still need. (CodeSha256 was tried first and rejected by `sam validate
  # --lint`: GetAtt does not expose that attribute on
  # AWS::Lambda::Function - only Arn/SnapStartResponse do.)
  EchoTargetVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref EchoTarget
      Description: !Sub 'image: ${EchoTargetImageUri}'

  # EchoTargetVersion is never invoked directly - handlers use
  # !Ref EchoTargetVersion, whose Ref return value is the qualified
  # version ARN.

  # EchoTargetTenant is a SECOND, tenant-isolation-enabled deployment of
  # the SAME echo-target image, used ONLY by requirement 5-8 ("Invoke
  # with tenantId"). This is a separate function, not a property added to
  # EchoTarget itself, for two real, confirmed reasons this session
  # discovered the hard way (both via real, deployed, then-reverted
  # attempts - not guessed):
  #
  #   1. TenancyConfig.TenantIsolationMode can ONLY be set at function
  #      CREATION time (AWS Lambda's own documentation, docs.aws.amazon.
  #      com/lambda/latest/dg/tenant-isolation-configure.html: "You
  #      cannot enable tenant isolation on existing functions") - so it
  #      cannot be conditionally toggled on a single shared EchoTarget
  #      resource depending on which Invoke5N* function happens to be
  #      calling it.
  #   2. More importantly, tenant isolation is NOT merely additive/
  #      optional once enabled on a function - confirmed by a real,
  #      deployed regression this session hit directly: after adding
  #      TenancyConfig to EchoTarget itself (rather than a separate
  #      function), EVERY OTHER Invoke5N* requirement that does NOT pass
  #      a TenantId (5-1 through 5-7, 5-9 through 5-16) started failing
  #      with a real, observed ChainedInvokeFailed error: "The invoked
  #      function is enabled with tenancy configuration. Add a valid
  #      tenant ID in your request and try again." (InvalidParameterValue
  #      Exception) - i.e. enabling tenant isolation makes a TenantId
  #      REQUIRED on every single invocation of that function, not just
  #      permitted. A single shared target genuinely cannot serve both
  #      "tenant ID required" (5-8) and "tenant ID must be absent" (every
  #      other requirement) simultaneously - hence this second, dedicated
  #      function, deployed from the exact same echo-target image (same
  #      EchoTargetImageUri parameter, same durable design - see that
  #      module's own main.go doc comment) with ONLY the TenancyConfig
  #      property differing. 5-8's own ExpectedExecutionHistory does not
  #      assert ChainedInvokeStartedDetails.DurableExecutionArn (unlike
  #      every other Invoke5N* requirement), so this target's own
  #      durability is not independently exercised by 5-8 itself - it is
  #      durable purely because it is built from the identical image as
  #      EchoTarget, not because 5-8 itself requires it.
  EchoTargetTenant:
    Type: AWS::Lambda::Function
    Properties:
      PackageType: Image
      Code:
        ImageUri: !Ref EchoTargetImageUri
      Role: !GetAtt EchoTargetExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Architectures:
        - arm64
      DurableConfig:
        ExecutionTimeout: 30
        RetentionPeriodInDays: 1
      TenancyConfig:
        TenantIsolationMode: PER_TENANT

  # EchoTargetTenantVersion mirrors EchoTargetVersion above for the
  # SAME reason - EchoTargetTenant is also durable, so it also needs a
  # qualified ARN to be invocable at all.
  EchoTargetTenantVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref EchoTargetTenant
      Description: !Sub 'image: ${EchoTargetImageUri}'

  # EchoTargetExecutionRole is EchoTarget's OWN minimal execution role -
  # deliberately NOT ConformanceExecutionRole (which grants
  # AWSLambdaBasicDurableExecutionRolePolicy, meaningless for a plain,
  # non-durable function like this one) - just the plain
  # AWSLambdaBasicExecutionRole every ordinary Lambda function needs for
  # its own CloudWatch Logs access. Also includes
  # AWSLambdaBasicDurableExecutionRolePolicy (added when this target
  # became durable - see main.go's own doc for why - mirroring
  # ConformanceExecutionRole's own identical pair of managed policies
  # above): a durable function's own runtime needs this to make its OWN
  # checkpoint API calls back to the Lambda service, independent of
  # anything its CALLER's role (ConformanceExecutionRole) grants for
  # invoking IT.
  EchoTargetExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicDurableExecutionRolePolicy
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # EchoTargetInvokePolicy grants ConformanceExecutionRole (shared by
  # every Invoke5N* function below, exactly like every other suite's
  # functions already share it) permission to actually call EchoTarget -
  # the CALLER-side identity policy a same-account operations.Invoke call
  # genuinely needs (see EchoTarget's own doc comment above for why no
  # resource-based policy on EchoTarget itself is required instead).
  # Grants on BOTH the base function ARN and a wildcard version/alias
  # suffix (EchoTarget.Arn is the UNQUALIFIED ARN; the actual invoke
  # target used by every Invoke5N* handler is EchoTargetVersion's own
  # qualified ARN - see that resource's own doc for why a durable target
  # needs one - lambda:InvokeFunction's own resource pattern matching
  # requires the wildcard suffix to cover both an unqualified Resource
  # entry and any :N-qualified one).
  EchoTargetInvokePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ConformanceEchoTargetInvokePolicy
      Roles:
        - !Ref ConformanceExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource:
              - !GetAtt EchoTarget.Arn
              - !Sub '${EchoTarget.Arn}:*'
              - !GetAtt EchoTargetTenant.Arn
              - !Sub '${EchoTargetTenant.Arn}:*'

