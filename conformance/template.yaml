  #      HeartbeatTimeoutSeconds) on its CALLBACK/CALLBACK START
  #      checkpoint - confirmed by grepping the entire operations
  #      package for "CallbackOptions" before this fix: zero matches
  #      outside wire.go (the struct's own definition) and awssdk/
  #      client.go (its marshaling, already covered by an existing
  #      client_test.go case) - the option simply didn't exist on
  #      CreateCallback's own CallbackOption[T] surface at all. Added
  #      WithCallbackTimeout/WithCallbackHeartbeatTimeout (new exported
  #      options, used by callback_4_3/4_4/4_5/4_8/4_11/4_14.go).
  #   2. A checkpointed CALLBACK operation with a terminal
  #      OperationStatusTimedOut status (the backend's own outcome for a
  #      real timeout - types.OperationStatusTimedOut already existed on
  #      the wire enum, confirmed used elsewhere for CHAINED_INVOKE) fell
  #      through EVERY status switch in callback.go (CreateCallback's own
  #      replay branch, and awaitCallback) straight to the
  #      SUCCESS/deserialize path, since both switches only ever checked
  #      for OperationStatusFailed explicitly. This silently produced a
  #      confusing generic "succeeded but no result recorded" SerdesError
  #      instead of the correct *CallbackFailedError - and separately,
  #      CallbackFailedError.Timeout was hard-coded false in every
  #      construction site (its own doc literally said "Always false
  #      currently... reserved for when heartbeat-timeout enforcement
  #      lands"). Fixed by routing OperationStatusTimedOut through the
  #      same callbackError(...) path as OperationStatusFailed in both
  #      switches, and having callbackError itself set Timeout :=
  #      (op.Status == types.OperationStatusTimedOut) rather than a
  #      constant.
  #
