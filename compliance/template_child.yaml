  ChildCustomSerdes:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-14"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_custom_serdes/
      Handler: bootstrap
      Description: Child context with custom serdes (succeed)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
