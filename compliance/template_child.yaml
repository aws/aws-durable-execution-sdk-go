AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Go (Child Context)
Parameters:
  ExecutionRoleArn:
    Type: String
    Description: IAM role the deployed functions assume
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 300
    MemorySize: 128

Resources:
  AttemptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
      - AttributeName: executionId
        AttributeType: S
      KeySchema:
      - AttributeName: executionId
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  ChildBasic:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-1"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_basic/
      Handler: bootstrap
      Description: Child context basic (single step inside)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildWithName:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-2"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_with_name/
      Handler: bootstrap
      Description: Child context with name
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildMultipleSteps:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-3"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_multiple_steps/
      Handler: bootstrap
      Description: Child context with multiple sequential steps
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildError:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-4"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_error/
      Handler: bootstrap
      Description: Child context error (step fails, execution fails)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildErrorCaught:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-5"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_error_caught/
      Handler: bootstrap
      Description: Child context error caught (try/catch, execution succeeds)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildNested:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-6"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_nested/
      Handler: bootstrap
      Description: Nested child contexts
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildRetry:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-7"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_retry/
      Handler: bootstrap
      Description: Child context with step retry (fails then succeeds)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          ATTEMPTS_TABLE_NAME:
            Ref: AttemptsTable

  ChildRetryExhaustion:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-8"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_retry_exhaustion/
      Handler: bootstrap
      Description: Child context with step retry exhaustion (child fails)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildReplay:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-9"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_replay/
      Handler: bootstrap
      Description: Child context replay (returns cached result)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildStepAndWait:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-10"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_step_and_wait/
      Handler: bootstrap
      Description: Child context with step and wait inside
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildLargePayload:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-11"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_large_payload/
      Handler: bootstrap
      Description: Child context large payload (ReplayChildren mode)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildInterrupted:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-12"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_interrupted/
      Handler: bootstrap
      Description: Child context interrupted and re-executed
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          ATTEMPTS_TABLE_NAME:
            Ref: AttemptsTable

  ChildWaitReplay:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-13"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_wait_replay/
      Handler: bootstrap
      Description: Child context with wait inside - verify replay
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildCustomSerdes:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-14"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_custom_serdes/
      Handler: bootstrap
      Description: Child context with custom serdes (succeed)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildErrorNoStep:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-15"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_error_no_step/
      Handler: bootstrap
      Description: Child context error without step (error thrown directly in child body)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildNullResult:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-16"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_null_result/
      Handler: bootstrap
      Description: Child context returning null
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildPrintOnly:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-17"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_print_only/
      Handler: bootstrap
      Description: Child context with print only (verify no re-execution on replay)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildStepWaitAfter:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-18"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_step_wait_after/
      Handler: bootstrap
      Description: Child context with step and wait inside, step and wait after
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildBasicLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildBasic}"
      RetentionInDays: 7

  ChildWithNameLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildWithName}"
      RetentionInDays: 7

  ChildMultipleStepsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildMultipleSteps}"
      RetentionInDays: 7

  ChildErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildError}"
      RetentionInDays: 7

  ChildErrorCaughtLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildErrorCaught}"
      RetentionInDays: 7

  ChildNestedLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildNested}"
      RetentionInDays: 7

  ChildRetryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildRetry}"
      RetentionInDays: 7

  ChildRetryExhaustionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildRetryExhaustion}"
      RetentionInDays: 7

  ChildReplayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildReplay}"
      RetentionInDays: 7

  ChildStepAndWaitLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildStepAndWait}"
      RetentionInDays: 7

  ChildLargePayloadLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildLargePayload}"
      RetentionInDays: 7

  ChildInterruptedLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildInterrupted}"
      RetentionInDays: 7

  ChildWaitReplayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildWaitReplay}"
      RetentionInDays: 7

  ChildCustomSerdesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildCustomSerdes}"
      RetentionInDays: 7

  ChildErrorNoStepLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildErrorNoStep}"
      RetentionInDays: 7

  ChildNullResultLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildNullResult}"
      RetentionInDays: 7

  ChildPrintOnlyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildPrintOnly}"
      RetentionInDays: 7

  ChildStepWaitAfterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ChildStepWaitAfter}"
      RetentionInDays: 7
