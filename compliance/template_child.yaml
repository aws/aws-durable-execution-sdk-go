AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Go (Child Context)
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 300
    MemorySize: 128

Resources:
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DurableExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:CheckpointDurableExecution
            - lambda:GetDurableExecutionState
            Resource: '*'
      - PolicyName: DynamoDBPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            Resource:
              Fn::GetAtt:
              - AttemptsTable
              - Arn

  AttemptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
      - AttributeName: executionId
        AttributeType: S
      KeySchema:
      - AttributeName: executionId
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  ChildBasic:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-1"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_basic/
      Handler: bootstrap
      Description: Child context basic (single step inside)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildWithName:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-2"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_with_name/
      Handler: bootstrap
      Description: Child context with name
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildMultipleSteps:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-3"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_multiple_steps/
      Handler: bootstrap
      Description: Child context with multiple sequential steps
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildError:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-4"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_error/
      Handler: bootstrap
      Description: Child context error (step fails, execution fails)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildErrorCaught:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-5"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_error_caught/
      Handler: bootstrap
      Description: Child context error caught (try/catch, execution succeeds)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildNested:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-6"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_nested/
      Handler: bootstrap
      Description: Nested child contexts
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildRetry:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-7"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_retry/
      Handler: bootstrap
      Description: Child context with step retry (fails then succeeds)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          ATTEMPTS_TABLE_NAME:
            Ref: AttemptsTable

  ChildRetryExhaustion:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-8"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_retry_exhaustion/
      Handler: bootstrap
      Description: Child context with step retry exhaustion (child fails)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildReplay:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-9"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_replay/
