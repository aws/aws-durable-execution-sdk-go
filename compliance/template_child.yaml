      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildErrorNoStep:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-15"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_error_no_step/
      Handler: bootstrap
      Description: Child context error without step (error thrown directly in child body)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildNullResult:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-16"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_null_result/
      Handler: bootstrap
      Description: Child context returning null
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildPrintOnly:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-17"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_print_only/
      Handler: bootstrap
      Description: Child context with print only (verify no re-execution on replay)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  ChildStepWaitAfter:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["3-18"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_step_wait_after/
      Handler: bootstrap
      Description: Child context with step and wait inside, step and wait after
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
