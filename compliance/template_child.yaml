      TestDescription: ["3-11"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/child_large_payload/
      Handler: bootstrap
      Description: Child context large payload (ReplayChildren mode)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
