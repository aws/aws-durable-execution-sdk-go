AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Go (DAG)
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 300
    MemorySize: 128

Resources:
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DurableExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:CheckpointDurableExecution
            - lambda:GetDurableExecutionState
            - lambda:InvokeFunction
            Resource: '*'

  # Target functions (no TestingMetadata; invoked by DagInvoke handler)

  TargetEcho:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/target_echo/
      Handler: bootstrap
      Description: Echo target function (waits briefly, echoes input)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagDiamond:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-1"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_diamond/
      Handler: bootstrap
      Description: DAG diamond fan-out/fan-in with typed dependency injection
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagCompensation:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-2"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_compensation/
      Handler: bootstrap
      Description: DAG trigger-rule compensation (COMPLETED_WITH_FAILURES)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagRunIf:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-3"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_run_if/
      Handler: bootstrap
      Description: DAG per-task conditional execution via WithRunIf
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagWaitResume:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-4"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_wait_resume/
      Handler: bootstrap
      Description: DAG in-graph Wait task suspending and resuming the invocation
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagChild:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-5"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_child/
      Handler: bootstrap
      Description: DAG task that is a runInChildContext (flat child container under the DAG)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagMap:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-6"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_map/
      Handler: bootstrap
      Description: DAG task that is a map over a fixed item list (flat map container)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagParallel:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-7"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_parallel/
      Handler: bootstrap
      Description: DAG task that is a parallel of two named branches (flat parallel container)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagWaitForCondition:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-8"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_wait_for_condition/
      Handler: bootstrap
      Description: DAG task that is a waitForCondition (flat WaitForCondition op under the DAG)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagNested:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-9"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_nested/
      Handler: bootstrap
      Description: DAG task that is itself a nested DAG / sub-dag (flat nested Dag container)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagInvoke:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-10"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_invoke/
      Handler: bootstrap
      Description: DAG task that is a durable invoke of the echo target function
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          TARGET_FUNCTION_NAME: !Sub "${TargetEcho.Arn}:$LATEST"

  DagCallback:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-11"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_callback/
      Handler: bootstrap
      Description: DAG task that is a wait-for-callback completed externally
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagRunIfAbort:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-12"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_run_if_abort/
      Handler: bootstrap
      Description: DAG runIf abort - a throwing predicate aborts the DAG with a typed error (execution FAILS)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagConcurrentOverlap:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-13"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_concurrent_overlap/
      Handler: bootstrap
      Description: DAG real concurrent overlap in one invocation (name-based task ids under out-of-order completion)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagConcurrentSuspend:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-14"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_concurrent_suspend/
      Handler: bootstrap
      Description: DAG inverted readiness across a suspend (two waits in flight, downstream pair starts across resumes)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagLargePayload:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-15"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_large_payload/
      Handler: bootstrap
      Description: DAG >256KB aggregate offloaded and replayed across a suspend (digest before == after proves fidelity through Go's ReplayChildren re-execution)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagRetry:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-16"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_retry/
      Handler: bootstrap
      Description: DAG per-task retry recovers a flaky task inside the DAG and its result flows downstream (flaky SUCCEEDED, after runs)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  DagNestedLargePayload:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["10-17"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/dag_nested_large_payload/
      Handler: bootstrap
      Description: Nested DAG whose inner >256KB aggregate offloads BOTH containers; inner per-task detail survives replay (digest before == after proves nested-offload fidelity)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
