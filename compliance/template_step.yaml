AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Go (Step)
Parameters:
  ExecutionRoleArn:
    Type: String
    Description: IAM role the deployed functions assume
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 300
    MemorySize: 128

Resources:
  AttemptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
      - AttributeName: executionId
        AttributeType: S
      KeySchema:
      - AttributeName: executionId
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  StepBasic:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-1"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_basic/
      Handler: bootstrap
      Description: Step basic (succeeds on first attempt)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepWithName:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-2"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_with_name/
      Handler: bootstrap
      Description: Step with name
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepNested:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-3"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_nested/
      Handler: bootstrap
      Description: Sequential steps where second depends on first
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepComplexObject:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-4"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_complex_object/
      Handler: bootstrap
      Description: Returning complex object
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepNullResult:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-5"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_null_result/
      Handler: bootstrap
      Description: Undefined/null result
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepCustomSerdes:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-6"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_custom_serdes/
      Handler: bootstrap
      Description: Custom serdes (per-step)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepLogging:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-7"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_logging/
      Handler: bootstrap
      Description: Step with context logger
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepAndWaitReplay:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-8"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_and_wait_replay/
      Handler: bootstrap
      Description: Step and wait with replay
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepReplaySkipsSucceeded:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-9"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_replay_skips_succeeded/
      Handler: bootstrap
      Description: Replay skips succeeded step
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepReplayRethrowsFailed:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-10"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_replay_rethrows_failed/
      Handler: bootstrap
      Description: Replay re-throws failed step
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepWithRetry:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-11"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_with_retry/
      Handler: bootstrap
      Description: Step with retry (fails then succeeds)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          ATTEMPTS_TABLE_NAME:
            Ref: AttemptsTable

  StepRetryExhaustion:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-12"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_retry_exhaustion/
      Handler: bootstrap
      Description: Retry exhaustion (max attempts)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepDefaultRetry:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-13"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_default_retry/
      Handler: bootstrap
      Description: Default retry strategy
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          ATTEMPTS_TABLE_NAME:
            Ref: AttemptsTable

  StepRetryCustomConfig:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-14"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_retry_custom_config/
      Handler: bootstrap
      Description: Retry with custom config (fixed interval and backoff)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          ATTEMPTS_TABLE_NAME:
            Ref: AttemptsTable

  StepRetrySpecificException:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-15"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_retry_specific_exception/
      Handler: bootstrap
      Description: Retry specific exception
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          ATTEMPTS_TABLE_NAME:
            Ref: AttemptsTable

  StepRetryNonRetryable:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-16"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_retry_non_retryable/
      Handler: bootstrap
      Description: Retry specific exception (non-retryable fails)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepAtMostOnceNoRetry:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-17"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_at_most_once_no_retry/
      Handler: bootstrap
      Description: Step with AtMostOncePerRetry semantics (interrupted, no retry)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepAtMostOnceWithRetry:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-18"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_at_most_once_with_retry/
      Handler: bootstrap
      Description: Step with AtMostOncePerRetry semantics (with retry, succeeds on second attempt)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300
      Environment:
        Variables:
          ATTEMPTS_TABLE_NAME:
            Ref: AttemptsTable

  StepWithError:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-19"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_with_error/
      Handler: bootstrap
      Description: Step with error (fails permanently)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepErrorCaught:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["1-20"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/step_error_caught/
      Handler: bootstrap
      Description: Error caught and handled (try/catch)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  StepBasicLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepBasic}"
      RetentionInDays: 7

  StepWithNameLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepWithName}"
      RetentionInDays: 7

  StepNestedLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepNested}"
      RetentionInDays: 7

  StepComplexObjectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepComplexObject}"
      RetentionInDays: 7

  StepNullResultLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepNullResult}"
      RetentionInDays: 7

  StepCustomSerdesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepCustomSerdes}"
      RetentionInDays: 7

  StepLoggingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepLogging}"
      RetentionInDays: 7

  StepAndWaitReplayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepAndWaitReplay}"
      RetentionInDays: 7

  StepReplaySkipsSucceededLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepReplaySkipsSucceeded}"
      RetentionInDays: 7

  StepReplayRethrowsFailedLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepReplayRethrowsFailed}"
      RetentionInDays: 7

  StepWithRetryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepWithRetry}"
      RetentionInDays: 7

  StepRetryExhaustionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepRetryExhaustion}"
      RetentionInDays: 7

  StepDefaultRetryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepDefaultRetry}"
      RetentionInDays: 7

  StepRetryCustomConfigLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepRetryCustomConfig}"
      RetentionInDays: 7

  StepRetrySpecificExceptionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepRetrySpecificException}"
      RetentionInDays: 7

  StepRetryNonRetryableLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepRetryNonRetryable}"
      RetentionInDays: 7

  StepAtMostOnceNoRetryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepAtMostOnceNoRetry}"
      RetentionInDays: 7

  StepAtMostOnceWithRetryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepAtMostOnceWithRetry}"
      RetentionInDays: 7

  StepWithErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepWithError}"
      RetentionInDays: 7

  StepErrorCaughtLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StepErrorCaught}"
      RetentionInDays: 7
