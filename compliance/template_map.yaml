  MapOpSerde:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-19"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_op_serde/
      Handler: bootstrap
      Description: Map operation-level serdes - serialize on a fresh operation
      Role:
