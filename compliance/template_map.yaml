AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Go (Map)
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 300
    MemorySize: 128

Resources:
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DurableExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:CheckpointDurableExecution
            - lambda:GetDurableExecutionState
            Resource: '*'

  MapBasic:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-1"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_basic/
      Handler: bootstrap
      Description: Map basic (one step per item, all succeed)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapItemsOnly:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-2"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_items_only/
      Handler: bootstrap
      Description: Map items-only form (no operation name)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapItemIndex:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-3"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_item_index/
      Handler: bootstrap
      Description: Map function receives item and index
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapEmpty:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-4"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_empty/
      Handler: bootstrap
      Description: Map with an empty items list
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapFailFast:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-5"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_fail_fast/
      Handler: bootstrap
      Description: Map fail-fast (tolerated-failure-count=0) stops after first failure
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapThrowIfError:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-6"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_throw_if_error/
      Handler: bootstrap
      Description: Map throw-if-error propagates an item failure to the execution
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapMinSuccessful:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-7"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_min_successful/
      Handler: bootstrap
      Description: Map min-successful early completion
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapToleratedWithin:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-8"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_tolerated_within/
      Handler: bootstrap
      Description: Map tolerated-failure-count within tolerance (all items complete)
      Role:
