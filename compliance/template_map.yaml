AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Go (Map)
Parameters:
  ExecutionRoleArn:
    Type: String
    Description: IAM role the deployed functions assume
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 300
    MemorySize: 128
    # The conformance runner correlates CloudWatch records to a durable
    # execution with a JSON filter on the executionArn field the SDK context
    # logger attaches. That field only survives under the JSON log format.
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: INFO

Resources:
  MapBasic:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-1"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_basic/
      Handler: bootstrap
      Description: Map basic (one step per item, all succeed)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapItemsOnly:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-2"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_items_only/
      Handler: bootstrap
      Description: Map items-only form (no operation name)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapItemIndex:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-3"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_item_index/
      Handler: bootstrap
      Description: Map function receives item and index
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapEmpty:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-4"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_empty/
      Handler: bootstrap
      Description: Map with an empty items list
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapFailFast:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-5"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_fail_fast/
      Handler: bootstrap
      Description: Map fail-fast (tolerated-failure-count=0) stops after first failure
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapThrowIfError:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-6"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_throw_if_error/
      Handler: bootstrap
      Description: Map throw-if-error propagates an item failure to the execution
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapMinSuccessful:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-7"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_min_successful/
      Handler: bootstrap
      Description: Map min-successful early completion
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapToleratedWithin:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-8"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_tolerated_within/
      Handler: bootstrap
      Description: Map tolerated-failure-count within tolerance (all items complete)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapToleratedExceeded:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-9"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_tolerated_exceeded/
      Handler: bootstrap
      Description: Map tolerated-failure-count exceeded (stops early)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapToleratedPct:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-10"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_tolerated_pct/
      Handler: bootstrap
      Description: Map tolerated-failure-percentage exceeded (stops early)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapConcurrent:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-11"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_concurrent/
      Handler: bootstrap
      Description: Map real concurrency preserves index-ordered results
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapFlat:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-12"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_flat/
      Handler: bootstrap
      Description: Map with FLAT nesting (virtual iteration contexts)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapItemNamer:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-13"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_item_namer/
      Handler: bootstrap
      Description: Map with a custom item namer
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapCustomSerde:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-14"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_custom_serde/
      Handler: bootstrap
      Description: Map with a custom per-item serdes
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapSuspendIteration:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-15"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_suspend_iteration/
      Handler: bootstrap
      Description: Map suspends inside an iteration; replay skips the completed iteration
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapLargeResult:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-16"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_large_result/
      Handler: bootstrap
      Description: Map with a large aggregate result (exceeds checkpoint size threshold)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapThenWait:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-17"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_then_wait/
      Handler: bootstrap
      Description: Suspension after a successful map (replay skips the completed map)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapFailThenWait:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-18"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_fail_then_wait/
      Handler: bootstrap
      Description: Suspension after a map that completed with a failure
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapOpSerde:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-19"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_op_serde/
      Handler: bootstrap
      Description: Map operation-level serdes - serialize on a fresh operation
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapOpSerdeReplay:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-20"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_op_serde_replay/
      Handler: bootstrap
      Description: Map operation-level serdes - deserialize on replay
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  MapBasicLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapBasic}"
      RetentionInDays: 7

  MapItemsOnlyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapItemsOnly}"
      RetentionInDays: 7

  MapItemIndexLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapItemIndex}"
      RetentionInDays: 7

  MapEmptyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapEmpty}"
      RetentionInDays: 7

  MapFailFastLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapFailFast}"
      RetentionInDays: 7

  MapThrowIfErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapThrowIfError}"
      RetentionInDays: 7

  MapMinSuccessfulLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapMinSuccessful}"
      RetentionInDays: 7

  MapToleratedWithinLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapToleratedWithin}"
      RetentionInDays: 7

  MapToleratedExceededLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapToleratedExceeded}"
      RetentionInDays: 7

  MapToleratedPctLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapToleratedPct}"
      RetentionInDays: 7

  MapConcurrentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapConcurrent}"
      RetentionInDays: 7

  MapFlatLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapFlat}"
      RetentionInDays: 7

  MapItemNamerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapItemNamer}"
      RetentionInDays: 7

  MapCustomSerdeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapCustomSerde}"
      RetentionInDays: 7

  MapSuspendIterationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapSuspendIteration}"
      RetentionInDays: 7

  MapLargeResultLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapLargeResult}"
      RetentionInDays: 7

  MapThenWaitLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapThenWait}"
      RetentionInDays: 7

  MapFailThenWaitLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapFailThenWait}"
      RetentionInDays: 7

  MapOpSerdeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapOpSerde}"
      RetentionInDays: 7

  MapOpSerdeReplayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MapOpSerdeReplay}"
      RetentionInDays: 7
