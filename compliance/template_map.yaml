  MapOpSerdeReplay:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["9-20"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_op_serde_replay/
