    TestingMetadata:
      TestDescription: ["9-15"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/map_suspend_iteration/
      Handler: bootstrap
      Description: Map suspends inside an iteration; replay skips the completed iteration
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
