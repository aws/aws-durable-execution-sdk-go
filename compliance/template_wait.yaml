AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Go (Wait)
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 300
    MemorySize: 128

Resources:
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: DurableExecutionPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:CheckpointDurableExecution
            - lambda:GetDurableExecutionState
            Resource: '*'

  WaitBasic:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["2-1"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_basic/
      Handler: bootstrap
      Description: Wait basic
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitWithName:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["2-2"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_with_name/
      Handler: bootstrap
      Description: Wait with name
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitMultipleSequential:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["2-3"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_multiple_sequential/
      Handler: bootstrap
      Description: Multiple sequential waits
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitDurationUnits:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["2-4"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_duration_units/
      Handler: bootstrap
      Description: Wait with different duration units
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 3700

  WaitLongDuration:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["2-5"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_long_duration/
      Handler: bootstrap
      Description: Wait with long duration (1 hour)
      Role:
        Fn::GetAtt:
        - DurableFunctionRole
        - Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 7200

  WaitBasicLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitBasic}"
      RetentionInDays: 7

  WaitWithNameLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitWithName}"
      RetentionInDays: 7

  WaitMultipleSequentialLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitMultipleSequential}"
      RetentionInDays: 7

  WaitDurationUnitsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitDurationUnits}"
      RetentionInDays: 7

  WaitLongDurationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitLongDuration}"
      RetentionInDays: 7
