AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Go (Wait)
Parameters:
  ExecutionRoleArn:
    Type: String
    Description: IAM role the deployed functions assume
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 300
    MemorySize: 128

Resources:
  WaitBasic:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["2-1"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_basic/
      Handler: bootstrap
      Description: Wait basic
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitWithName:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["2-2"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_with_name/
      Handler: bootstrap
      Description: Wait with name
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitMultipleSequential:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["2-3"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_multiple_sequential/
      Handler: bootstrap
      Description: Multiple sequential waits
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitDurationUnits:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["2-4"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_duration_units/
      Handler: bootstrap
      Description: Wait with different duration units
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 3700

  WaitLongDuration:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["2-5"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_long_duration/
      Handler: bootstrap
      Description: Wait with long duration (1 hour)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 7200

  WaitBasicLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitBasic}"
      RetentionInDays: 7

  WaitWithNameLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitWithName}"
      RetentionInDays: 7

  WaitMultipleSequentialLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitMultipleSequential}"
      RetentionInDays: 7

  WaitDurationUnitsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitDurationUnits}"
      RetentionInDays: 7

  WaitLongDurationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitLongDuration}"
      RetentionInDays: 7
