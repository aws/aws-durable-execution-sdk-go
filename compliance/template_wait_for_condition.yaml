AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Execution Conformance Test Examples - Go (WaitForCondition)
Parameters:
  ExecutionRoleArn:
    Type: String
    Description: IAM role the deployed functions assume
Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 300
    MemorySize: 128

Resources:
  WaitForConditionBasic:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["6-1"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_condition_basic/
      Handler: bootstrap
      Description: Wait-for-condition basic (polls until threshold met)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitForConditionImmediate:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["6-2"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_condition_immediate/
      Handler: bootstrap
      Description: Wait-for-condition immediate stop (condition already met)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitForConditionWithName:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["6-3"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_condition_with_name/
      Handler: bootstrap
      Description: Wait-for-condition with explicit name
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitForConditionCustomInitialState:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["6-4"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_condition_custom_initial_state/
      Handler: bootstrap
      Description: Wait-for-condition with custom initial state
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitForConditionFixedDelay:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["6-5"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_condition_fixed_delay/
      Handler: bootstrap
      Description: Wait-for-condition with fixed-delay wait strategy
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitForConditionMaxAttempts:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["6-6"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_condition_max_attempts/
      Handler: bootstrap
      Description: Wait-for-condition max attempts exceeded (failure)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitForConditionCheckThrows:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["6-7"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_condition_check_throws/
      Handler: bootstrap
      Description: Wait-for-condition check throws (uncaught failure)
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitForConditionCheckThrowsCaught:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["6-8"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_condition_check_throws_caught/
      Handler: bootstrap
      Description: Wait-for-condition check throws, caught by handler
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitForConditionComplexObject:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["6-9"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_condition_complex_object/
      Handler: bootstrap
      Description: Wait-for-condition with complex object state
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitForConditionNullResult:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["6-10"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_condition_null_result/
      Handler: bootstrap
      Description: Wait-for-condition null result
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitForConditionCustomSerdes:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["6-11"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_condition_custom_serdes/
      Handler: bootstrap
      Description: Wait-for-condition with custom state serdes
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitForConditionThenStep:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["6-12"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_condition_then_step/
      Handler: bootstrap
      Description: Wait-for-condition followed by a step
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitForConditionMultipleSequential:
    Type: AWS::Serverless::Function
    TestingMetadata:
      TestDescription: ["6-13"]
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: publish/wait_for_condition_multiple_sequential/
      Handler: bootstrap
      Description: Multiple sequential wait_for_condition operations
      Role: !Ref ExecutionRoleArn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

  WaitForConditionBasicLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitForConditionBasic}"
      RetentionInDays: 7

  WaitForConditionImmediateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitForConditionImmediate}"
      RetentionInDays: 7

  WaitForConditionWithNameLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitForConditionWithName}"
      RetentionInDays: 7

  WaitForConditionCustomInitialStateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitForConditionCustomInitialState}"
      RetentionInDays: 7

  WaitForConditionFixedDelayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitForConditionFixedDelay}"
      RetentionInDays: 7

  WaitForConditionMaxAttemptsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitForConditionMaxAttempts}"
      RetentionInDays: 7

  WaitForConditionCheckThrowsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitForConditionCheckThrows}"
      RetentionInDays: 7

  WaitForConditionCheckThrowsCaughtLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitForConditionCheckThrowsCaught}"
      RetentionInDays: 7

  WaitForConditionComplexObjectLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitForConditionComplexObject}"
      RetentionInDays: 7

  WaitForConditionNullResultLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitForConditionNullResult}"
      RetentionInDays: 7

  WaitForConditionCustomSerdesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitForConditionCustomSerdes}"
      RetentionInDays: 7

  WaitForConditionThenStepLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitForConditionThenStep}"
      RetentionInDays: 7

  WaitForConditionMultipleSequentialLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WaitForConditionMultipleSequential}"
      RetentionInDays: 7
