      BuildMethod: makefile
    Properties:
      FunctionName: !Join
        - ''
        - - !Ref FunctionNamePrefix
          - go-error-handling-taxonomy
      CodeUri: .aws-sam/build-artifacts/error-handling-taxonomy/
      Handler: bootstrap
      Description: Error taxonomy with errors.As matching for StepError, InvokeError, CallbackError
      Role: !GetAtt DurableFunctionRole.Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 120

  HandlerErrorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Join
        - ''
        - - !Ref FunctionNamePrefix
          - go-handler-error
      CodeUri: .aws-sam/build-artifacts/handler-error/
      Handler: bootstrap
      Description: Handler-level error captured as structured FAILED result
      Role: !GetAtt DurableFunctionRole.Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 60

  # --- Slice 8: Showcase & Edge Cases ---

  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Join
        - ''
        - - !Ref FunctionNamePrefix
          - go-hello-world
      CodeUri: .aws-sam/build-artifacts/hello-world/
      Handler: bootstrap
      Description: Simplest durable function with no operations
      Role: !GetAtt DurableFunctionRole.Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 60

  SimpleExecutionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Join
        - ''
        - - !Ref FunctionNamePrefix
          - go-simple-execution
      CodeUri: .aws-sam/build-artifacts/simple-execution/
      Handler: bootstrap
      Description: Handler execution without durable operations
      Role: !GetAtt DurableFunctionRole.Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 60

  NonDurableFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Join
        - ''
        - - !Ref FunctionNamePrefix
          - go-non-durable
      CodeUri: .aws-sam/build-artifacts/non-durable/
      Handler: bootstrap
      Description: Plain Lambda function without durable execution SDK
      Role: !GetAtt DurableFunctionRole.Arn

  NoReplayExecutionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Join
        - ''
        - - !Ref FunctionNamePrefix
          - go-no-replay-execution
      CodeUri: .aws-sam/build-artifacts/no-replay-execution/
      Handler: bootstrap
      Description: Sequential steps completing on first invocation without replay
      Role: !GetAtt DurableFunctionRole.Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 60

  LargePayloadFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Join
        - ''
        - - !Ref FunctionNamePrefix
          - go-large-payload
      CodeUri: .aws-sam/build-artifacts/large-payload/
      Handler: bootstrap
      Description: Large payload handling via ReplayChildren offload path
      Role: !GetAtt DurableFunctionRole.Arn
      MemorySize: 512
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 120

  UndefinedResultsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Join
        - ''
        - - !Ref FunctionNamePrefix
          - go-undefined-results
      CodeUri: .aws-sam/build-artifacts/undefined-results/
      Handler: bootstrap
      Description: Operations returning nil values replay correctly
      Role: !GetAtt DurableFunctionRole.Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 60

  ComprehensiveOperationsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Join
        - ''
        - - !Ref FunctionNamePrefix
          - go-comprehensive-operations
      CodeUri: .aws-sam/build-artifacts/comprehensive-operations/
      Handler: bootstrap
      Description: All major operations (Step, Wait, Map, Parallel) in one handler
      Role: !GetAtt DurableFunctionRole.Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 120

