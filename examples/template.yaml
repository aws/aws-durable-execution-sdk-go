AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Lambda Durable Execution SDK for Go - Examples

Parameters:
  FunctionNamePrefix:
    Type: String
    Default: ''
    Description: Optional prefix for Lambda function names

Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 60
    MemorySize: 128
    Architectures:
      - x86_64

Resources:
  DurableFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DurableExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:CheckpointDurableExecution
                  - lambda:GetDurableExecutionState
                Resource: '*'
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: '*'
              - Effect: Allow
                Action:
                  - lambda:SendDurableExecutionCallbackSuccess
                  - lambda:SendDurableExecutionCallbackFailure
                  - lambda:SendDurableExecutionCallbackHeartbeat
                Resource: '*'

  # --- Existing examples ---

  OrderFulfillmentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Join
        - ''
        - - !Ref FunctionNamePrefix
          - go-order-fulfillment
      CodeUri: .aws-sam/build-artifacts/order-fulfillment/
      Handler: bootstrap
      Description: Order fulfillment workflow demonstrating Step, Wait, Parallel, and child context
      Role: !GetAtt DurableFunctionRole.Arn
      DurableConfig:
        RetentionPeriodInDays: 7
        ExecutionTimeout: 300

