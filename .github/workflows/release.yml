name: Release

# Runs when a GitHub Release is published. Publishing the release creates
# its tag, and for Go the tag is the release: the go command fetches a
# module version from its Git tag, through the module proxy. So this
# workflow publishes nothing and pushes nothing. It checks the release:
#
# 1. The tag points at a commit on main.
# 2. For an SDK release, the tagged commit sets durable.Version to the
#    released version.
# 3. The module proxy serves the version from the tagged commit. Asking
#    the proxy for the version also makes pkg.go.dev list it.
# 4. A new module that imports the released module from the proxy builds.
#
# The workflow asks the module proxy for the version only after checks 1
# and 2 pass. So when one of those fails, the workflow has not fetched
# the version. A user's go command may still have fetched it, and the
# proxy keeps serving a version it has fetched even after its tag is
# deleted. So fix a failed check with the next version. See RELEASING.md.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: verify ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    # The module proxy can take up to 30 minutes to serve a new version,
    # and the release tool waits up to 35.
    timeout-minutes: 45
    steps:
      # For a release event, checkout checks out the release's tag at the
      # commit the event names.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The release tool checks that the tag is on main, so it needs
          # the history of main.
          fetch-depth: 0
          persist-credentials: false

      # The newest Go release builds every module, whatever its go
      # directive. The release tool fetches modules into an empty module
      # cache, so a dependency cache would go unused.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: stable
          cache: false

      - name: Verify the release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: go run -C .github/scripts/release . verify "$TAG"
