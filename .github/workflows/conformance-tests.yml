name: Conformance Tests

# Full-integration conformance run: discovers suites from
# conformance/template_<suite>.yaml, builds the Go handlers against the local
# SDK (conformance/go.mod has a committed replace => ../), and runs each suite
# as its own parallel matrix job with the pinned language-agnostic runner.

on:
  push:
    branches: [main]
    paths:
      - "durable/**"
      - "conformance/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/conformance-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "durable/**"
      - "conformance/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/conformance-tests.yml"
  workflow_dispatch:
    inputs:
      region:
        description: "AWS Region for deploying and running conformance tests"
        required: false
        default: us-west-2
        type: string

env:
  AWS_REGION: ${{ github.event.inputs.region || 'us-west-2' }}

concurrency:
  group: ${{ github.head_ref || github.ref_name || github.run_id }}-conformance
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover_suites:
    name: discover conformance suites
    # CodeBuild-hosted runner in the Go testing account (EC2 compute); the label
    # must match the CodeBuild project name. Pull requests from forks are routed
    # to GitHub-hosted runners. This is routing, not a trust boundary: the fork
    # boundary is the repository's approval setting for fork workflows.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    outputs:
      suites: ${{ steps.discover.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover suites from templates
        id: discover
        working-directory: conformance
        run: |
          suites=$(for t in template_*.yaml; do
            s=${t#template_}
            printf '%s\n' "${s%.yaml}"
          done | jq -R . | jq -s -c .)
          echo "Discovered suites: $suites"
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  conformance:
    name: conformance (${{ matrix.suite }})
    needs: discover_suites
    # Fork and Dependabot pull requests get no secrets, so skip them.
    if: github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    # Same routing as above.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    permissions:
      contents: read
      id-token: write # Required for AWS OIDC credentials
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.discover_suites.outputs.suites) }}
    defaults:
      run:
        working-directory: conformance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v6.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: conformance/go.sum

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: "${{ secrets.TEST_ROLE_ARN }}"
          role-session-name: goConformanceTest
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS test account
        env:
          TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
        run: |
          ACTUAL_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACTUAL_ACCOUNT_ID" != "$TEST_ACCOUNT_ID" ]; then
            echo "Expected AWS account $TEST_ACCOUNT_ID but assumed into $ACTUAL_ACCOUNT_ID"
            exit 1
          fi
          echo "Using AWS test account $ACTUAL_ACCOUNT_ID"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3

      - name: Build conformance handlers
        run: ./build_examples.sh

      # Installed from main, matching the Python and JS SDK repos: the released
      # versions do not accept --parameter-overrides.
      - name: Install conformance runner
        run: |
          pip install "git+https://github.com/aws/aws-durable-execution-conformance-tests.git@main#subdirectory=packages/aws-durable-execution-conformance-tests"

      - name: Compute stack-safe suite slug
        run: |
          # CloudFormation stack names allow only [a-zA-Z][-a-zA-Z0-9]*;
          # suite names like wait_for_condition contain underscores.
          echo "SUITE_SLUG=$(echo '${{ matrix.suite }}' | tr '_' '-')" >> "$GITHUB_ENV"

      - name: Run conformance suite
        env:
          EXECUTION_ROLE_ARN: ${{ secrets.TEST_LAMBDA_EXECUTION_ROLE_ARN }}
        run: |
          python -m aws_durable_execution_conformance_tests.app \
            --template template_${{ matrix.suite }}.yaml \
            --language go \
            --suite ${{ matrix.suite }} \
            --name conf-go-${SUITE_SLUG}-${{ github.run_id }} \
            --region ${{ env.AWS_REGION }} \
            --parameter-overrides ExecutionRoleArn="$EXECUTION_ROLE_ARN" \
            --history-dir history-${{ matrix.suite }} \
            --report junit \
            --report-file report-${{ matrix.suite }}

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report-${{ matrix.suite }}
          path: |
            conformance/report-${{ matrix.suite }}.xml
            conformance/history-${{ matrix.suite }}/
          if-no-files-found: warn
