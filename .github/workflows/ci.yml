name: CI

permissions:
  contents: read

on:
  push:
    branches: [alpha]
  pull_request:
    branches: [alpha]

jobs:
  check:
    name: check (${{ matrix.module.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - { name: durable, dir: "." }
          - { name: insight, dir: "insight" }
          - { name: conformance, dir: "conformance" }
          - { name: examples, dir: "examples" }
          - { name: analysis, dir: "analysis" }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: ${{ matrix.module.dir }}/go.mod
          cache-dependency-path: ${{ matrix.module.dir }}/go.sum

      - name: Build
        working-directory: ${{ matrix.module.dir }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module.dir }}
        run: go vet ./...

      # The cloud test harness is build-tagged out of normal builds;
      # make sure it still compiles.
      - name: Vet cloud test harness
        if: matrix.module.name == 'examples'
        working-directory: examples
        run: go vet -tags cloud ./cloud

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.0.0
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module.dir }}

      - name: Check formatting
        working-directory: ${{ matrix.module.dir }}
        run: |
          diff=$(golangci-lint fmt --diff ./...)
          if [ -n "$diff" ]; then
            echo "$diff"
            echo "Files are not properly formatted. Run 'make fmt' (or 'golangci-lint fmt ./...')."
            exit 1
          fi

      - name: Test
        working-directory: ${{ matrix.module.dir }}
        run: go test -race ./...

      # The determinism analyzer must stay clean on the repository's own
      # examples and conformance handlers.
      - name: Run durablelint on examples and conformance
        if: matrix.module.name == 'analysis'
        run: |
          go build -C analysis -o "$RUNNER_TEMP/durablelint" ./cmd/durablelint
          (cd examples && "$RUNNER_TEMP/durablelint" ./...)
          (cd conformance && "$RUNNER_TEMP/durablelint" ./...)

  # The published nested modules (insight, analysis) must be consumable
  # from outside the repository, and the release script that pins and tags
  # them must keep working. See CONTRIBUTING.md, "Releasing".
  consumable:
    name: consumable (nested modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: insight/go.sum

      - name: Test the release script
        run: sh scripts/release_test.sh

      # A throwaway module imports each nested module by its published
      # path. Both the nested module and the root module come from this
      # checkout, so the check does not depend on a published root version.
      - name: Build a throwaway consumer of the nested modules
        run: sh scripts/verify-consumable.sh --root-from-checkout
