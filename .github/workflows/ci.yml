name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: check (${{ matrix.module.name }})
    # CodeBuild-hosted runner in the Go testing account (EC2 compute); the label
    # must match the CodeBuild project name. Pull requests from forks are routed
    # to GitHub-hosted runners. This is routing, not a trust boundary: the fork
    # boundary is the repository's approval setting for fork workflows.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    strategy:
      fail-fast: false
      matrix:
        module:
          - { name: durable, dir: "." }
          - { name: telemetry, dir: "telemetry" }
          - { name: conformance, dir: "conformance" }
          - { name: conformance-telemetry, dir: "conformance-telemetry" }
          - { name: examples, dir: "examples" }
          - { name: analysis, dir: "analysis" }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: ${{ matrix.module.dir }}/go.mod
          cache-dependency-path: ${{ matrix.module.dir }}/go.sum

      - name: Build
        working-directory: ${{ matrix.module.dir }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module.dir }}
        run: go vet ./...

      # The cloud test harness is build-tagged out of normal builds;
      # make sure it still compiles.
      - name: Vet cloud test harness
        if: matrix.module.name == 'examples'
        working-directory: examples
        run: go vet -tags cloud ./cloud

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.0.0
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module.dir }}

      - name: Check formatting
        working-directory: ${{ matrix.module.dir }}
        run: |
          diff=$(golangci-lint fmt --diff ./...)
          if [ -n "$diff" ]; then
            echo "$diff"
            echo "Files are not properly formatted. Run 'make fmt' (or 'golangci-lint fmt ./...')."
            exit 1
          fi

      - name: Test
        working-directory: ${{ matrix.module.dir }}
        run: go test -race ./...

      # The determinism analyzer must stay clean on the repository's own
      # examples and conformance handlers.
      - name: Run durablelint on examples and conformance
        if: matrix.module.name == 'analysis'
        run: |
          go build -C analysis -o "$RUNNER_TEMP/durablelint" ./cmd/durablelint
          (cd examples && "$RUNNER_TEMP/durablelint" ./...)
          (cd conformance && "$RUNNER_TEMP/durablelint" ./...)
          (cd conformance-telemetry && "$RUNNER_TEMP/durablelint" ./...)

  # The check job runs each module on the Go version its go.mod declares,
  # which is the oldest Go release that builds the module. This job runs
  # the published modules on the two newest Go releases, the setup-go
  # aliases stable and oldstable. See "Go versions" in the README.
  supported-go:
    name: supported-go (${{ matrix.module.name }}, ${{ matrix.go }})
    # Same routing as above.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    strategy:
      fail-fast: false
      matrix:
        go: [stable, oldstable]
        module:
          - { name: durable, dir: "." }
          - { name: telemetry, dir: "telemetry" }
          - { name: analysis, dir: "analysis" }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: ${{ matrix.module.dir }}/go.sum

      - name: Build
        working-directory: ${{ matrix.module.dir }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module.dir }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module.dir }}
        run: go test -race ./...

  # A user's module must be able to import every package of the published
  # nested modules (telemetry, analysis). The release tool builds a new
  # module that imports them by their published paths, with every module
  # of this repository taken from the checkout. See RELEASING.md.
  #
  # One leg per nested module, with Go taken from that module's go.mod. The
  # modules declare different minimums (analysis needs Go 1.25 for
  # golang.org/x/tools; the SDK modules need Go 1.24), and setup-go pins
  # GOTOOLCHAIN=local, so the toolchain cannot upgrade itself. Each leg
  # therefore checks a user's module on the oldest Go the module allows.
  consumable:
    name: consumable (${{ matrix.module }})
    # Same routing as above.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    strategy:
      fail-fast: false
      matrix:
        module: [telemetry, analysis]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build a new module that imports the nested module
        run: go run -C .github/scripts/release . consumer ${{ matrix.module }}

  # The release tool in .github/scripts/release is a module of its own, so
  # no published module contains it. This job tests the tool, and checks
  # that durable.Version and the SDK version that each nested module
  # requires agree. See RELEASING.md.
  release-tool:
    name: release tool
    # Same routing as above.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    defaults:
      run:
        working-directory: .github/scripts/release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The tool has no dependencies, so it has no go.sum to key a cache on.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: .github/scripts/release/go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.0.0
        with:
          version: v2.12.2
          working-directory: .github/scripts/release

      - name: Check formatting
        run: |
          diff=$(golangci-lint fmt --diff ./...)
          if [ -n "$diff" ]; then
            echo "$diff"
            echo "Files are not properly formatted. Run 'golangci-lint fmt ./...'."
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      - name: Check the versions
        run: go run . check
