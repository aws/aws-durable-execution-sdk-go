name: Cloud tests

# Deploys every example with SAM into the test account, then invokes each
# example function and asserts its durable execution reaches the terminal
# state documented in examples/README.md (harness: examples/cloud).

on:
  pull_request:
    branches: [alpha]
  workflow_dispatch:
    inputs:
      region:
        description: "AWS Region for deploying and running cloud tests"
        required: false
        default: us-west-2
        type: string

env:
  AWS_REGION: ${{ github.event.inputs.region || 'us-west-2' }}
  STACK_NAME: go-examples-ci
  FUNCTION_NAME_PREFIX: goci-

permissions:
  contents: read

jobs:
  example-tests:
    name: example-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # Required for AWS OIDC credentials
    concurrency:
      group: go-cloud-tests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: examples/go.sum

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: "${{ secrets.TEST_ROLE_ARN }}"
          role-session-name: goExamplesGitHubCloudTest
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS test account
        env:
          TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
        run: |
          ACTUAL_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACTUAL_ACCOUNT_ID" != "$TEST_ACCOUNT_ID" ]; then
            echo "Expected AWS account $TEST_ACCOUNT_ID but assumed into $ACTUAL_ACCOUNT_ID"
            exit 1
          fi
          echo "Using AWS test account $ACTUAL_ACCOUNT_ID"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

      - name: Build examples
        working-directory: examples
        run: ./build.sh

      - name: Deploy examples with SAM
        working-directory: examples
        run: |
          sam build --template-file template.yaml
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --region "$AWS_REGION" \
            --parameter-overrides FunctionNamePrefix="$FUNCTION_NAME_PREFIX"

      - name: Run cloud tests
        working-directory: examples
        run: |
          go test -tags cloud ./cloud -run TestExamples \
            -v -timeout 80m -parallel 8
