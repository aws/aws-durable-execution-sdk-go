name: Cloud tests

# Deploys every example with SAM into the test account, then runs two
# test passes against the deployed functions: the smoke test in
# examples/cloud, which invokes each example once and checks its terminal
# state, result, or error type against examples/cloud/expectations.go; and
# each example's own handler test in cloud mode, which reuses the
# assertions that ci.yml runs locally (see examples/internal/extest).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      region:
        description: "AWS Region for deploying and running cloud tests"
        required: false
        default: us-west-2
        type: string

env:
  AWS_REGION: ${{ github.event.inputs.region || 'us-west-2' }}
  STACK_NAME: go-examples-ci
  FUNCTION_NAME_PREFIX: goci-

permissions:
  contents: read

jobs:
  example-tests:
    name: example-tests
    # Fork and Dependabot pull requests get no secrets, so skip them.
    if: github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    # CodeBuild-hosted runner in the Go testing account (EC2 compute); the label
    # must match the CodeBuild project name. Pull requests from forks are routed
    # to GitHub-hosted runners. This is routing, not a trust boundary: the fork
    # boundary is the repository's approval setting for fork workflows.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('codebuild-github-actions-runner-{0}-{1}', github.run_id, github.run_attempt) }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # Required for AWS OIDC credentials
    concurrency:
      group: go-cloud-tests
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v6.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: examples/go.sum

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: "${{ secrets.TEST_ROLE_ARN }}"
          role-session-name: goExamplesGitHubCloudTest
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS test account
        env:
          TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
        run: |
          ACTUAL_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACTUAL_ACCOUNT_ID" != "$TEST_ACCOUNT_ID" ]; then
            echo "Expected AWS account $TEST_ACCOUNT_ID but assumed into $ACTUAL_ACCOUNT_ID"
            exit 1
          fi
          echo "Using AWS test account $ACTUAL_ACCOUNT_ID"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3

      - name: Build examples
        working-directory: examples
        run: ./build.sh

      - name: Deploy examples with SAM
        working-directory: examples
        env:
          EXECUTION_ROLE_ARN: ${{ secrets.TEST_LAMBDA_EXECUTION_ROLE_ARN }}
        run: |
          sam build --template-file template.yaml
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION" \
            --parameter-overrides \
              FunctionNamePrefix="$FUNCTION_NAME_PREFIX" \
              ExecutionRoleArn="$EXECUTION_ROLE_ARN"

      - name: Run cloud smoke test
        working-directory: examples
        run: |
          go test -tags cloud ./cloud -run TestExamples \
            -v -timeout 80m -parallel 8

      - name: Run example tests in cloud mode
        working-directory: examples
        env:
          DURABLE_EXAMPLES_RUNNER: cloud
        run: |
          go test ./... -run TestHandler -timeout 80m -p 8
