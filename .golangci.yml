version: "2"

linters:
  enable:
    - revive
  settings:
    errcheck:
      check-type-assertions: true
    revive:
      rules:
        # Parameter names in exported signatures are API documentation
        # (rendered in godoc) and must not be renamed to _ in stubs or
        # interface-shaped implementations.
        - name: unused-parameter
          disabled: true
  exclusions:
    rules:
      # Conformance handler error strings mirror the other language SDKs'
      # handlers and may be asserted verbatim by the conformance suite;
      # their capitalization must not be "fixed".
      - path: compliance/
        linters:
          - staticcheck
        text: "ST1005"

formatters:
  enable:
    - gofmt
    - goimports
